name: Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "5"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Configurar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Baixar aplicativo Android
        run: |
          mkdir -p apps

          curl --fail --location --retry 3 \
            --output apps/native-demo-app.apk \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk

          test -s apps/native-demo-app.apk

      - name: Executar testes Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            pwd
            ls -la ./scripts
            bash -x ./scripts/run-android-tests.sh

      - name: Gerar relatorio Allure
        if: always()
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -name '*-result.json' -print -quit)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "Nenhum resultado de teste encontrado."
          fi

      - name: Publicar resultados Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          if-no-files-found: warn
          retention-days: 3
  publish-report:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar relatorio Allure
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./downloaded-report

      - name: Verificar relatorio
        id: report
        run: |
          if [ -f ./downloaded-report/allure-report/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Relatorio nao encontrado."
          fi

      - name: Configurar GitHub Pages
        if: steps.report.outputs.available == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicacao
        if: steps.report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./downloaded-report/allure-report

      - name: Publicar relatorio
        if: steps.report.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

