name: iOS Tests

on:
  push:
    branches:
      - feature/ios-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Listar simuladores iOS
        run: |
          xcrun simctl list devices available

      - name: Verificar ambiente
        run: |
          sw_vers
          node --version

      - name: Baixar aplicativo iOS
        run: |
          curl -fL --retry 3 \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/iOS-Simulator-NativeDemoApp-2.2.0.app.zip \
            -o ios-app.zip

      - name: Extrair aplicativo
        run: |
          mkdir -p apps/ios
          unzip -q ios-app.zip -d apps/ios
          find apps/ios -maxdepth 3 -name "*.app"