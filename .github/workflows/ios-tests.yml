name: iOS Tests

on:
  push:
    branches:
      - feature/ios-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Listar simuladores iOS
        run: |
          xcrun simctl list devices available

      - name: Verificar ambiente
        run: |
          sw_vers
          node --version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Appium e XCUITest
        run: |
          npm install -g appium@3
          appium driver install xcuitest

      - name: Baixar aplicativo iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.2.0 \
            --repo webdriverio/native-demo-app \
            --json assets \
            --jq '.assets[].name'

          ASSET=$(gh release view v2.2.0 \
            --repo webdriverio/native-demo-app \
            --json assets \
            --jq '.assets[].name' |
            grep -Ei 'ios.*simulator.*\.zip$' |
            head -n 1)

          if [ -z "$ASSET" ]; then
            echo "Artefato iOS Simulator nao encontrado."
            exit 1
          fi

          echo "Baixando: $ASSET"

          gh release download v2.2.0 \
            --repo webdriverio/native-demo-app \
            --pattern "$ASSET" \
            --output ios-app.zip

      - name: Extrair aplicativo
        run: |
          mkdir -p apps/ios
          unzip -q ios-app.zip -d apps/ios
          find apps/ios -name "*.app"

      - name: Iniciar simulador iOS
        run: |
          xcrun simctl boot "iPhone 16 Pro"
          xcrun simctl bootstatus "iPhone 16 Pro" -b

      - name: Instalar aplicativo iOS
        run: |
          xcrun simctl install booted apps/ios/wdiodemoapp.app

      - name: Identificar Bundle ID
        run: |
          /usr/libexec/PlistBuddy \
            -c "Print CFBundleIdentifier" \
            apps/ios/wdiodemoapp.app/Info.plist

      - name: Abrir aplicativo iOS
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print CFBundleIdentifier" \
            apps/ios/wdiodemoapp.app/Info.plist)

          xcrun simctl launch booted "$BUNDLE_ID"

      - name: Verificar simulador
        run: |
          xcrun simctl list devices booted

      - name: Executar teste iOS
        run: |
          appium --log appium-ios.log &
          APPIUM_PID=$!

          trap 'kill "$APPIUM_PID" 2>/dev/null || true' EXIT

          echo "Aguardando Appium..."

          for i in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:4723/status > /dev/null; then
              break
            fi
            sleep 2
          done

          npx wdio run ./wdio.ios.conf.js